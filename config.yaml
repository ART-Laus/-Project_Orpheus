# Project Orpheus — конфигурация проекта
# Секреты (SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET) хранятся в .env, не в git.

spotify:
  redirect_uri: "https://example.com/callback"
  scope: "user-library-read playlist-read-private"
  cache_path: ".cache"

paths:
  data_dir: "data"
  raw_dir: "raw"
  db_dir: "db"

import:
  # Сохранять сырые ответы API в data/raw/ для аудита
  raw_enabled: true
  # Как часто (секунд) пересохранять базу во время импорта (resume)
  save_interval_s: 60
  # Пауза (секунд) перед первым повтором при 429
  retry_base_s: 2.0

slskd:
  # Локальный демон Soulseek (tools/slskd/), API-ключ читается из config_path
  base_url: "http://localhost:5030"
  config_path: "tools/slskd/slskd.yml"

quality:
  # Общая политика качества: FLAC > нативный AAC/M4A > MP3 >= 320
  min_mp3_bitrate: 320
  min_aac_bitrate: 256
  # Допуск по длительности при сопоставлении результата с треком
  duration_tolerance_s: 5
  # Допуск по длительности при проверке скачанного файла (verify)
  verify_tolerance_s: 10
  # Сколько кандидатов пробуем скачать для одного трека/альбома
  max_candidates: 5

sources:
  # Источники в порядке приоритета. Nicotine+ (Soulseek) — самый верхний
  # per-track источник; мост поднимается автоматически (нужна учётка
  # Soulseek, та же, что в Nicotine+ на Windows)
  - name: nicotine
    enabled: true
    host: "127.0.0.1"
    port: 5390
    username: ""
    password: ""
  # Затем rutracker (альбомами), открытые трекеры (torrents:), прямые
  # (bandcamp/jamendo/zaycev), затем yandex
  - name: rutracker
    enabled: true
    base_url: "https://rutracker.org/forum"
    login: ""
    password: ""
    # Минимальное качество релиза: flac / mp3_320 / any
    min_quality: "flac"
    qbit:
      # qBittorrent-nox WebUI (пароль установлен через API)
      url: "http://localhost:8080"
      username: "admin"
      password: "orpheus"
  # Открытые торрент-трекеры (нужен VPN для заблокированных доменов)
  - name: torrents
    enabled: true
    qbit:
      url: "http://localhost:8080"
      username: "admin"
      password: "orpheus"
    # Каждый трекер: bases — список зеркал (первое доступное),
    # min_quality: flac / mp3_320 / any
    sources:
      - name: rutor
        enabled: true
        bases: ["https://rutor.info", "https://rutor.nl", "http://rutor.org"]
        min_quality: "mp3_320"
      - name: x1337
        enabled: true
        bases: ["https://x1337x.se", "https://1337x.st", "https://x1337x.eu"]
        min_quality: "mp3_320"
      - name: tpb
        enabled: true
        bases: ["https://pirate-proxy.club", "https://piratez.xyz", "https://tpb.surf"]
        min_quality: "any"
      - name: torrentino
        enabled: true
        bases: ["http://torrentino.me"]
        min_quality: "mp3_320"
      - name: fast_torrent
        enabled: true
        bases: ["http://fast-torrent.ru"]
        min_quality: "mp3_320"
      - name: torrentdownloads
        enabled: true
        bases: ["https://torrentdownloads.me", "https://torrentdownloads.unblockit.bz"]
        min_quality: "mp3_320"
      - name: limetorrents
        enabled: true
        bases: ["https://limetorrents.zone", "https://limetor.com"]
        min_quality: "mp3_320"
  # Прямые источники
  - name: bandcamp
    enabled: true
  - name: jamendo
    enabled: true
    # client_id из https://developer.jamendo.com (или JAMENDO_CLIENT_ID в .env)
    client_id: ""
  - name: zaycev
    enabled: true
  - name: yandex
    enabled: true
    # Токен OAuth: orpheus yandex login (или YANDEX_TOKEN в .env);
    # секрет хранится в data/cache/yandex_token.txt, не в config.yaml
    token: ""

library:
  # Медиатека: Library/Исполнитель/Альбом/NN. Название.<ext>
  dir: "Library"
  # Обложка засчитывается (cover_verified) только от этого размера
  # (у Spotify стандарт 640x640)
  cover_min_size: 640
  cover_preferred_size: 1400
